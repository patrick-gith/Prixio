{% extends "SalesBotApp/base_salesbot.html" %}
{% load humanize %}
{% block salesbot_content %}
<div class="card" style="padding:0;">
  <table style="width:100%; border-collapse:collapse; font-size:13px;">
    {% for log in logs %}
    <tr style="border-bottom:1px solid var(--border);">
      <td style="padding:9px 14px;"><span class="badge badge-primary">{{ log.channel }}</span></td>
      <td style="padding:9px 14px;"><span class="badge {% if log.status == 'published' %}badge-success{% else %}badge-warning{% endif %}">{{ log.status }}</span></td>
      <td style="padding:9px 14px;">{{ log.reason }}</td>
      <td style="padding:9px 14px;">{{ log.score|default:"—" }}</td>
      <td style="padding:9px 14px;" class="text-muted">{{ log.created_at|naturaltime }}</td>
    </tr>
    {% empty %}<tr><td colspan="5" style="padding:20px; text-align:center;" class="text-muted">Aucun log.</td></tr>{% endfor %}
  </table>
</div>
{% endblock %}
