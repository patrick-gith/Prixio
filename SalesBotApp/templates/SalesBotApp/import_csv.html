{% extends "SalesBotApp/base_salesbot.html" %}
{% block salesbot_content %}
<div class="card">
  <h2 style="font-size:18px; font-weight:800;">Importer le catalogue CSV</h2>
  <p class="text-muted" style="font-size:13px;">
    Colonnes reconnues : <code>slug,title,url_comeup,description,keywords_fr,keywords_en,category</code>.
  </p>
  <form method="post" enctype="multipart/form-data" style="margin-top:14px;">
    {% csrf_token %}
    {% for field in form %}
      <div style="margin-bottom:10px;"><label class="text-muted" style="font-size:12px; font-weight:700; text-transform:uppercase;">{{ field.label }}</label>{{ field }}</div>
    {% endfor %}
    <button class="btn btn-primary"><i class="fas fa-file-import"></i> Importer</button>
    <a href="{% url 'SalesBotApp:services_list' %}" class="btn btn-secondary">Annuler</a>
  </form>
</div>
{% endblock %}
