{% extends "SalesBotApp/base_salesbot.html" %}
{% block salesbot_content %}
<div class="card">
  <h2 style="font-size:18px; font-weight:800;">Canal {{ policy.channel|capfirst }}</h2>
  <form method="post" style="margin-top:14px;">
    {% csrf_token %}
    {% for field in form %}
      <div style="margin-bottom:12px;">
        <label class="text-muted" style="font-size:12px; font-weight:700; text-transform:uppercase;">{{ field.label }}</label>
        {{ field }}
      </div>
    {% endfor %}
    <button class="btn btn-primary"><i class="fas fa-save"></i> Enregistrer</button>
    <a href="{% url 'SalesBotApp:channels' %}" class="btn btn-secondary">Annuler</a>
  </form>
</div>
{% endblock %}
