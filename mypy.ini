[mypy]
python_version = 3.12
ignore_missing_imports = True
no_strict_optional = False
warn_unused_ignores = True
warn_redundant_casts = True

# Migrations : code auto-généré, on ne type pas
[mypy-*.migrations.*]
ignore_errors = True

[mypy-CatalogApp.migrations.*]
ignore_errors = True
[mypy-PricingApp.migrations.*]
ignore_errors = True
[mypy-PrixioApp.migrations.*]
ignore_errors = True
[mypy-CoreApp.migrations.*]
ignore_errors = True
