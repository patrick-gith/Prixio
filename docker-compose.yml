services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: Prixiodb
      POSTGRES_USER: guizo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-prixio_dev_pw}
    ports:
      - "5435:5432"   # 5433/5434 pris par africinvoice — 5435 libre
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guizo -d Prixiodb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"   # 6379 pris par redis-server local WSL
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: "True"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me-please-xxxxxxxx}
      DB_HOST: db
      DB_NAME: Prixiodb
      DB_USER: guizo
      DB_PASSWORD: ${DB_PASSWORD:-prixio_dev_pw}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"   # 8000 pris par africinvoice_web_dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
