services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: Prixiodb
      POSTGRES_USER: guizo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-prixio_dev_pw}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guizo -d Prixiodb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: "True"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me-please-xxxxxxxx}
      DB_HOST: db
      DB_NAME: Prixiodb
      DB_USER: guizo
      DB_PASSWORD: ${DB_PASSWORD:-prixio_dev_pw}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app

volumes:
  pgdata:
