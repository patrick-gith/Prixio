services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: Prixiodb
      POSTGRES_USER: guizo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-prixio_dev_pw}
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guizo -d Prixiodb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    env_file:
      - .env
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: "True"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me-please-xxxxxxxx}
      DB_HOST: db
      DB_NAME: Prixiodb
      DB_USER: guizo
      DB_PASSWORD: ${DB_PASSWORD:-prixio_dev_pw}
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SALESBOT_MIN_SCORE: ${SALESBOT_MIN_SCORE:-0.30}
      SALESBOT_MIN_CONFIDENCE: ${SALESBOT_MIN_CONFIDENCE:-0.50}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  celery-worker:
    entrypoint: []
    build: .
    env_file:
      - .env
    command: celery -A ProjectPrixio worker -l info
    environment:
      DEBUG: "True"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me-please-xxxxxxxx}
      DB_HOST: db
      DB_NAME: Prixiodb
      DB_USER: guizo
      DB_PASSWORD: ${DB_PASSWORD:-prixio_dev_pw}
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SALESBOT_MIN_SCORE: ${SALESBOT_MIN_SCORE:-0.30}
      SALESBOT_MIN_CONFIDENCE: ${SALESBOT_MIN_CONFIDENCE:-0.50}
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  celery-beat:
    entrypoint: []
    build: .
    env_file:
      - .env
    command: celery -A ProjectPrixio beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DEBUG: "True"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me-please-xxxxxxxx}
      DB_HOST: db
      DB_NAME: Prixiodb
      DB_USER: guizo
      DB_PASSWORD: ${DB_PASSWORD:-prixio_dev_pw}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

volumes:
  pgdata: