[pytest]
DJANGO_SETTINGS_MODULE = ProjectPrixio.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --reuse-db
    --nomigrations
    -ra
    --cov=PricingApp
    --cov=PrixioApp
    --cov=CatalogApp
    --cov=CoreApp
    --cov-report=term-missing
    --cov-fail-under=50
markers =
    slow: tests lents (réseau, intégration)
    integration: tests qui touchent des services externes