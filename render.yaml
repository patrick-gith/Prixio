# render.yaml
services:
  # Service Web Principal (Django + Gunicorn)
  - type: web
    name: prixio-web
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: |
      pip install -r requirements.lock.txt || pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn ProjectPrixio.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 60
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false # À définir manuellement dans le dashboard Render
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: prixio-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: prixio-redis
          type: redis
          property: connectionString
      - key: COMPANY_EMAIL
        value: "contact@prixio.app"
      # Ajoutez ici vos autres variables (EBAY_CLIENT_ID, TELEGRAM_BOT_TOKEN, etc.)
    autoDeploy: false # Désactivé car on utilise GitHub Actions

  # Worker Celery pour les tâches asynchrones (batch, collecte)
  - type: worker
    name: prixio-worker
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.lock.txt || pip install -r requirements.txt
    startCommand: celery -A ProjectPrixio worker -l info -Q batch,collect,default --concurrency=2
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: prixio-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: prixio-redis
          type: redis
          property: connectionString

  # Worker Celery Beat pour les tâches planifiées (collecte quotidienne)
  - type: worker
    name: prixio-beat
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.lock.txt || pip install -r requirements.txt
    startCommand: celery -A ProjectPrixio beat -l info
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: prixio-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: prixio-redis
          type: redis
          property: connectionString

# Base de données PostgreSQL managée
databases:
  - name: prixio-db
    plan: free
    region: frankfurt
    databaseName: prixio
    user: prixio_user

# Instance Redis managée (pour Celery)
redis:
  - name: prixio-redis
    plan: free
    region: frankfurt
    ipAllowList: [] # Accessible depuis les services Render