# .github/workflows/deploy.yml
name: 🚀 Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prixio_test
          POSTGRES_USER: prixio
          POSTGRES_PASSWORD: prixio
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      # Variables lues par settings.py
      DJANGO_SECRET_KEY: test-secret-key-for-ci-only
      DEBUG: "False"
      RENDER_DATABASE_URL: postgres://prixio:prixio@localhost:5432/prixio_test
      REDIS_URL: redis://localhost:6379/0
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      # Empêche Celery de chercher un broker en test
      CELERY_TASK_ALWAYS_EAGER: "True"

    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libcairo2 libgdk-pixbuf-2.0-0 libopenjp2-7 fonts-dejavu-core

      - name: 📦 Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock.txt || pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: ✅ Django check
        run: python manage.py check

      - name: 🧪 Run tests
        run: pytest --cov=PricingApp --cov=PrixioApp --cov-report=term --cov-fail-under=50

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Trigger Render Deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"